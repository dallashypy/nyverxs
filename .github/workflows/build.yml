name: build

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ['v*']

permissions:
  contents: write

jobs:
  theos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: brew install ldid xz dpkg

      - name: Theos
        run: |
          git clone --quiet --recursive https://github.com/theos/theos.git "$HOME/theos"
          # theos ships sdks/ as a placeholder dir; git clone refuses a non-empty target
          rm -rf "$HOME/theos/sdks"
          git clone --quiet --filter=blob:none --sparse --depth 1 \
            https://github.com/theos/sdks.git "$HOME/theos/sdks"
          cd "$HOME/theos/sdks"
          # One SDK is enough for this tweak; the repo ships a dozen and the
          # full clone is ~2 GB. BSD sort has no -V, so strip the prefix first.
          SDK="iPhoneOS$(git ls-tree --name-only HEAD | grep -E '^iPhoneOS[0-9.]+\.sdk$' | sed 's/^iPhoneOS//; s/\.sdk$//' | sort -n | tail -1).sdk"
          echo "sdk=$SDK"
          git sparse-checkout set --cone "$SDK"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          echo "SDK_NAME=$SDK" >> "$GITHUB_ENV"

      - name: Build
        run: |
          make clean package FINALPACKAGE=1
          ls -la packages/

      - uses: actions/upload-artifact@v4
        with:
          name: nyverxs
          if-no-files-found: error
          path: |
            packages/*.deb
            .theos/obj/**/*.dylib

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            packages/*.deb
            .theos/obj/arm64/NYVERXS.dylib
